spring.application.name=products-command
server.port=8081

#---------------MySQL configuration----------------
spring.datasource.url=jdbc:mysql://localhost:3306/db_spring_kafka
spring.datasource.username=root
spring.datasource.password=pass1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## (Opcional) Para que Hibernate cree y actualice las tablas automáticamente según tus entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#------------kafka configuration----------------
#Consumer kafka binding definition
#Método que se ejecutará cuando llegue un mensaje al topic products.commands
spring.cloud.function.definition=handleCommand
#Topic
spring.cloud.stream.bindings.handleCommand-in-0.destination=products.commands
spring.cloud.stream.bindings.handleCommand-in-0.content-type=application/json
spring.cloud.stream.bindings.handleCommand-in-0.group=products-command
spring.cloud.stream.bindings.handleCommand-in-0.startOffset=latest

#Binder kafka brokers
spring.cloud.stream.kafka.binder.brokers=localhost:9092

