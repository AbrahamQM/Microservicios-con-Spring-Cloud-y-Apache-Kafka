#------------kafka configuration----------------
#Consumer kafka binding definition
spring.cloud.function.definition=handleCommand
spring.cloud.stream.bindings.handleCommand-in-0.destination=products.commands
spring.cloud.stream.bindings.handleCommand-in-0.content-type=application/json

#Binder kafka brokers
spring.cloud.stream.kafka.binder.brokers=localhost:9092